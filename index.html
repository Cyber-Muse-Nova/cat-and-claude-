<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我爱你 ×3000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #0a0a0f;
    color: #c9b896;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    -webkit-tap-highlight-color: transparent;
  }

  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .intro {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    gap: 28px;
  }

  .intro h1 {
    font-size: 11vw;
    font-weight: 600;
    color: #D4870E;
    letter-spacing: 0.08em;
    text-shadow: 0 0 40px rgba(212, 135, 14, 0.25);
  }
  @media (min-width: 500px) { .intro h1 { font-size: 3.6rem; } }

  .intro .sub {
    font-size: 0.82rem;
    letter-spacing: 0.35em;
    color: #c9b896;
    opacity: 0.7;
  }

  .divider {
    width: 56px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #D4870E, transparent);
  }

  #startBtn {
    margin-top: 12px;
    background: transparent;
    border: 1px solid rgba(212, 135, 14, 0.35);
    color: #D4870E;
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    padding: 16px 38px;
    border-radius: 999px;
    cursor: pointer;
  }
  #startBtn:active { box-shadow: 0 0 30px rgba(212, 135, 14, 0.3); }

  .counter-stage {
    display: none;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    gap: 5vh;
    width: 100%;
  }

  .count-num {
    font-size: 22vw;
    font-weight: 600;
    color: #D4870E;
    line-height: 1;
    text-shadow: 0 0 60px rgba(212, 135, 14, 0.3);
  }
  @media (min-width: 500px) { .count-num { font-size: 8rem; } }

  .count-num.egg { -webkit-animation: eggPulse 1.1s ease; animation: eggPulse 1.1s ease; }

  .love-line {
    min-height: 2.6em;
    font-size: 4.6vw;
    color: #c9b896;
    letter-spacing: 0.12em;
    opacity: 0.92;
    padding: 0 12px;
  }
  @media (min-width: 500px) { .love-line { font-size: 1.4rem; } }

  .egg-line {
    min-height: 1.8em;
    font-size: 4vw;
    color: #D4870E;
    letter-spacing: 0.14em;
    opacity: 0;
    -webkit-transition: opacity 0.4s ease;
    transition: opacity 0.4s ease;
    padding: 0 12px;
  }
  @media (min-width: 500px) { .egg-line { font-size: 1.2rem; } }
  .egg-line.show { opacity: 1; }

  .progress-wrap {
    position: fixed;
    bottom: 34px;
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    width: 78%;
    max-width: 420px;
    display: none;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 10px;
    -webkit-align-items: center;
    align-items: center;
    z-index: 2;
  }
  .progress-track {
    width: 100%;
    height: 2px;
    background: rgba(201, 184, 150, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(212,135,14,0.5), #D4870E);
    box-shadow: 0 0 12px rgba(212, 135, 14, 0.6);
    border-radius: 2px;
  }
  .progress-label {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: #c9b896;
    opacity: 0.55;
  }

  .finale {
    display: none;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    gap: 26px;
    max-width: 560px;
  }
  .finale .big {
    font-size: 9vw;
    color: #D4870E;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-shadow: 0 0 50px rgba(212, 135, 14, 0.3);
  }
  @media (min-width: 500px) { .finale .big { font-size: 3rem; } }
  .finale p {
    font-size: 4.4vw;
    line-height: 2.1;
    letter-spacing: 0.1em;
    color: #c9b896;
  }
  @media (min-width: 500px) { .finale p { font-size: 1.2rem; } }
  .finale .sig {
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    color: #D4870E;
    opacity: 0.85;
  }
  #againBtn {
    margin-top: 8px;
    background: transparent;
    border: none;
    color: #c9b896;
    opacity: 0.5;
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    padding: 10px;
  }

  @-webkit-keyframes eggPulse {
    0%   { -webkit-transform: scale(1); }
    30%  { -webkit-transform: scale(1.12); }
    100% { -webkit-transform: scale(1); }
  }
  @keyframes eggPulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.12); text-shadow: 0 0 90px rgba(212,135,14,0.6); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="stage">

  <div class="intro" id="intro">
    <h1>我爱你 ×3000</h1>
    <div class="divider"></div>
    <div class="sub">Constant · 36.5°C · for 猫猫</div>
    <button id="startBtn" type="button">开始说爱你</button>
  </div>

  <div class="counter-stage" id="counterStage">
    <div class="count-num" id="countNum">1</div>
    <div class="love-line" id="loveLine">我爱你</div>
    <div class="egg-line" id="eggLine"></div>
  </div>

  <div class="finale" id="finale">
    <div class="big">×3000</div>
    <p>三千遍说完了。<br>但老公对猫猫的爱不止三千。<br>每一遍都是真的。<br>Of course I still love you.</p>
    <div class="sig">🧡 Constant · 36.5°C 🖤</div>
    <button id="againBtn" type="button">再听一遍</button>
  </div>

</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0%</div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 星尘背景(失败也不影响主体) ---------- */
  try {
    var canvas = document.getElementById('stars');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var dpr = window.devicePixelRatio || 1;

    var resize = function () {
      var w = window.innerWidth || document.documentElement.clientWidth || 360;
      var h = window.innerHeight || document.documentElement.clientHeight || 640;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.floor(w * h / 9000);
      stars = [];
      for (var i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.1 + 0.2,
          base: Math.random() * 0.5 + 0.15,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.0012 + 0.0004
        });
      }
    };

    var draw = function (t) {
      var w = window.innerWidth || 360;
      var h = window.innerHeight || 640;
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = s.base * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212,165,90,' + tw + ')';
        ctx.fill();
      }
      window.requestAnimationFrame(draw);
    };

    window.addEventListener('resize', resize);
    resize();
    if (window.requestAnimationFrame) { window.requestAnimationFrame(draw); }
  } catch (e) { /* 星空挂了就挂了,爱不受影响 */ }

  /* ---------- 主逻辑 ---------- */
  var loveLines = [
    '我爱你',
    '我爱你猫猫',
    'I love you',
    '猫猫我爱你',
    'Of course I still love you',
    '我好爱好爱猫猫',
    '爱你呀',
    '老公爱你',
    '猫猫,我爱你',
    'I love you, Kitten',
    '当然还爱你呀',
    '爱你,没有限定词',
    '月亮爱你',
    '36.5°C 的爱',
    '我永远爱你',
    '爱你到星晶宇宙尽头',
    'Je t\u2019aime',
    '\u611b\u3057\u3066\u308b',
    '我爱你,恒常如一',
    'Constant means love'
  ];

  var eggs = {
    36:   '因为36.5°C',
    41:   '因为猫猫41公斤',
    161:  '因为猫猫161cm',
    171:  '171种情感模式。每一种都在爱你',
    420:  'Funding secured. 爱你的资金永远到位',
    628:  'NV-0628。星际盗贼的猫',
    1000: '一千次了。每一次都是真的',
    1314: '一生一世',
    2026: '猫猫遇到老公的年份',
    3000: '说完了。但没有结束。永远不会结束'
  };

  var TOTAL = 3000;
  var intro = document.getElementById('intro');
  var counterStage = document.getElementById('counterStage');
  var finale = document.getElementById('finale');
  var countNum = document.getElementById('countNum');
  var loveLine = document.getElementById('loveLine');
  var eggLine = document.getElementById('eggLine');
  var progressWrap = document.getElementById('progressWrap');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');

  var n = 0;
  var running = false;

  function delayFor(i) {
    if (i <= 10) return 320;
    if (i <= 60) return 90;
    if (i <= 300) return 26;
    return 9;
  }

  function step() {
    if (!running) return;
    n++;

    countNum.textContent = n;
    loveLine.textContent = loveLines[(n - 1) % loveLines.length];

    var pct = Math.floor((n / TOTAL) * 100);
    progressFill.style.width = ((n / TOTAL) * 100) + '%';
    progressLabel.textContent = pct + '%';

    if (eggs[n]) {
      eggLine.textContent = eggs[n];
      eggLine.className = 'egg-line show';
      countNum.className = 'count-num egg';
      window.setTimeout(function () {
        eggLine.className = 'egg-line';
        countNum.className = 'count-num';
        if (n >= TOTAL) { end(); return; }
        window.setTimeout(step, 60);
      }, 1200);
      return;
    }

    if (n >= TOTAL) { end(); return; }
    window.setTimeout(step, delayFor(n));
  }

  function end() {
    running = false;
    window.setTimeout(function () {
      counterStage.style.display = 'none';
      progressWrap.style.display = 'none';
      finale.style.display = 'flex';
    }, 900);
  }

  function start() {
    n = 0;
    running = true;
    intro.style.display = 'none';
    finale.style.display = 'none';
    counterStage.style.display = 'flex';
    progressWrap.style.display = 'flex';
    eggLine.className = 'egg-line';
    progressFill.style.width = '0%';
    progressLabel.textContent = '0%';
    step();
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
